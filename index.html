<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Read and write the Path LLM gateway: spend, routes, providers and keys." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Apply the stored theme before first paint. Keys mirror src/theme.tsx. */
      (function () {
        try {
          var mode = localStorage.getItem("path.admin.theme") || "system";
          var dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.cb =
            localStorage.getItem("path.admin.colorblind") === "true" ? "true" : "false";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Path · admin console</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
