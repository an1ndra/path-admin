# Security headers.
#
# nginx does NOT merge add_header across levels: a location that declares any add_header
# discards everything inherited from the server block. That is how this console ended up
# framable — the headers were set at server level and every location silently dropped them.
# Every location that sets a header must include this file itself.
#
# frame-ancestors/X-Frame-Options matter more than usual here: the admin token lives in
# sessionStorage, so an attacker's iframe inherits the signed-in session and can drive
# privileged actions from a page the operator is looking at.

add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
