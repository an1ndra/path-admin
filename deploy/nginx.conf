# Main nginx config for an unprivileged container (USER nginx).
#
# The stock nginx.conf writes its PID to /run/nginx.pid and keeps temp bodies under
# /var/cache/nginx, both owned by root. Running as a non-root user therefore fails at
# startup with: open() "/run/nginx.pid" failed (13: Permission denied).
# Everything writable lives under /tmp, which is world-writable in the base image.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths for a non-root master process.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
