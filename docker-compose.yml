# Local/self-hosted example. Dokploy can build the Dockerfile directly; this compose file
# is for a box where you want the UI next to the gateway.
services:
  path-admin:
    build: .
    environment:
      # Leave empty when a reverse proxy serves the UI and the gateway on one hostname.
      GATEWAY_URL: ${GATEWAY_URL:-http://path:8080}
    ports:
      - "8088:8080"
    restart: unless-stopped
